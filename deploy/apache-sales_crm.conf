# Sales CRM — an application from us beside the Business OS kernel. Rendered by the kernel's installer (bin/app_install.php):
# {{APP_FQDN}} = crm.<domain> (the vhost label is crm, the catalog key sales_crm), {{APP_DIR}} = /srv/apps/sales_crm, the ports from config/.env.
# Two virtual hosts: the public name for people (and the proxied MCP servers, the key-checked records API, the ICS feed and the
# mailbox webhook), and a loopback port for the kernel's actions server and approval replays.
#
# The per-request ceilings below cover a CSV import (50,000 rows) or an attachment of 25 MB (the canonical store's ceiling).
# storage/ (attachments, import files, exports) is NEVER under the web root: the gate serves every byte.

<VirtualHost *:80>
	ServerName {{APP_FQDN}}
	DocumentRoot {{APP_DIR}}/html
	ErrorLog ${APACHE_LOG_DIR}/sales_crm-error.log
	CustomLog ${APACHE_LOG_DIR}/sales_crm-access.log combined
	SetEnvIf X-Forwarded-Proto "https" HTTPS=on
	LimitRequestBody 67108864
	<IfModule mod_headers.c>
		Header always set X-Content-Type-Options "nosniff"
		Header always set X-Frame-Options "SAMEORIGIN"
	</IfModule>

	<Directory {{APP_DIR}}/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
		# A CSV import (50,000 rows) or an attachment (25 MB); a dry run over a large file may take a while.
		php_admin_value upload_max_filesize 50M
		php_admin_value post_max_size 60M
		php_admin_value max_execution_time 300
		php_admin_value memory_limit 256M
	</Directory>

	# The two read MCP servers, under the application's name. Host is NOT preserved (the SDK's DNS-rebinding guard checks it
	# against loopback). Bearer auth is the servers' own (a person's token, the tenant's run token, or the kernel's).
	ProxyPreserveHost Off
	ProxyPass        /mcp/records  http://127.0.0.1:{{MCP_RECORDS_PORT}}/mcp
	ProxyPassReverse /mcp/records  http://127.0.0.1:{{MCP_RECORDS_PORT}}/mcp
	ProxyPass        /mcp/activity http://127.0.0.1:{{MCP_ACTIVITY_PORT}}/mcp
	ProxyPassReverse /mcp/activity http://127.0.0.1:{{MCP_ACTIVITY_PORT}}/mcp

	RewriteEngine On
	RewriteRule ^/mcp/(records|activity)(/|$) - [L]

	# The public allow-list under /api/v1/: the health check, the ICS feed (the token in the query is the authority) and the
	# records API (bearer = a person's key acting as them, or a lead-capture key creating leads only; rate-limited and logged by
	# the handler). Nothing else answers under /api.
	#   POST /api/v1/leads (capture)   GET|POST /api/v1/{leads|accounts|contacts|deals|activities}   GET|PATCH /api/v1/{kind}/{id}
	#   GET /api/v1/calendar.ics?token=
	RewriteRule ^/api/v1/health/?$ /api/v1/health.php [L,QSA]
	RewriteRule ^/api/v1/calendar\.ics$ /api/v1/calendar_ics.php [L,QSA]
	RewriteRule ^/api/v1/(leads|accounts|contacts|deals|activities)/?$ /api/v1/$1.php [L,QSA]
	RewriteRule ^/api/v1/(leads|accounts|contacts|deals|activities)/([0-9]+)/?$ /api/v1/$1.php?id=$2 [L,QSA]
	RewriteRule ^/api/v1/[a-z_-]+\.php$ - [L]
	RewriteRule ^/api/ - [R=404,L]

	# The logging mailbox's webhook (MaluMail, signed with the mailbox's secret; auth_kind none — the signature is the authority).
	RewriteRule ^/channels/malumail/mail$ /channels/malumail/mail.php [L,QSA]

	# The sign-on receivers.
	RewriteRule ^/sso$ /sso.php [L,QSA]
	RewriteRule ^/sso/logout$ /sso/logout.php [L,QSA]

	# The routing form (docs/phase1-consistency.md decision 11): the board's family by pipeline id or key; an email by direction; the unsubscribe
	# door (a public GET + POST, the token the authority); the attachment gate (the gate serves every byte); a stage form under its pipeline.
	RewriteRule ^/pipeline/([A-Za-z0-9_-]+)/(board|list|forecast|columns)/?$ /pipeline/$2.php?pipeline=$1 [L,QSA]
	RewriteRule ^/email/(in|out)/([0-9]+)/?$ /email/view.php?direction=$1&id=$2 [L,QSA]
	RewriteRule ^/u/([A-Za-z0-9_-]{16,128})/?$ /u/index.php?token=$1 [L,QSA]
	RewriteRule ^/attachments/([0-9]+)/?$ /attachments/download.php?id=$1 [L,QSA]
	RewriteRule ^/admin/pipelines/([0-9]+)/stages/new/?$ /admin/stages/form.php?pipeline=$1 [L,QSA]

	RewriteCond %{DOCUMENT_ROOT}/$1/$3.php -f
	RewriteRule ^/(.+)/([0-9]+)/([a-z_-]+)$ /$1/$3.php?id=$2 [L,QSA]

	# Canonical URLs (the action manifest, Phase 1): /x/new -> form.php, /x/{id}/edit -> form.php?id=, /x/{id} -> view.php?id=.
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>

# PHP on the internal port, for the kernel's actions server and approval replays only.
Listen 127.0.0.1:{{APP_INTERNAL_PORT}}
<VirtualHost 127.0.0.1:{{APP_INTERNAL_PORT}}>
	DocumentRoot {{APP_DIR}}/html
	ErrorLog ${APACHE_LOG_DIR}/sales_crm-error.log
	CustomLog ${APACHE_LOG_DIR}/sales_crm-access.log combined
	LimitRequestBody 67108864
	<IfModule mod_headers.c>
		Header always set X-Content-Type-Options "nosniff"
	</IfModule>
	<Directory {{APP_DIR}}/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
		php_admin_value upload_max_filesize 50M
		php_admin_value post_max_size 60M
		php_admin_value max_execution_time 300
		php_admin_value memory_limit 256M
	</Directory>
	RewriteEngine On
	RewriteRule ^/api/v1/health/?$ /api/v1/health.php [L,QSA]
	RewriteRule ^/pipeline/([A-Za-z0-9_-]+)/(board|list|forecast|columns)/?$ /pipeline/$2.php?pipeline=$1 [L,QSA]
	RewriteRule ^/email/(in|out)/([0-9]+)/?$ /email/view.php?direction=$1&id=$2 [L,QSA]
	RewriteRule ^/attachments/([0-9]+)/?$ /attachments/download.php?id=$1 [L,QSA]
	RewriteRule ^/admin/pipelines/([0-9]+)/stages/new/?$ /admin/stages/form.php?pipeline=$1 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/$3.php -f
	RewriteRule ^/(.+)/([0-9]+)/([a-z_-]+)$ /$1/$3.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>
